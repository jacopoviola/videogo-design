<style>

*{box-sizing:border-box}body{margin:0;background:var(--vg-surface-canvas);color:var(--vg-text-primary);font-family:"Instrument Sans",system-ui,sans-serif;font-size:16px;line-height:1.5}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--vg-focus);outline-offset:3px}button:disabled{opacity:.5;cursor:default}a{color:var(--vg-authorization)}.review{min-height:44px;padding:10px 24px;border-bottom:1px solid var(--vg-border-subtle);display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;font-size:12px;background:white}.review b{font-weight:600}.review button{font-size:12px;border:0;background:none;text-decoration:underline;padding:4px}.frame{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:calc(100vh - 44px)}nav{padding:32px 20px;background:var(--vg-surface-subtle);border-right:1px solid var(--vg-border-subtle)}.wordmark{font-size:18px;letter-spacing:.08em;font-weight:700;margin-bottom:40px}nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:12px;border-radius:8px;margin-bottom:4px}nav button[aria-current=page]{background:var(--vg-surface-selected);font-weight:600}.nav-note{font-size:12px;color:var(--vg-text-secondary);margin:40px 12px 0}main{width:100%;max-width:1160px;margin:0 auto;padding:48px 40px 32px}h1{font-size:44px;line-height:48px;letter-spacing:-.02em;font-weight:600;margin:0 0 16px}h2{font-size:22px;line-height:29px;font-weight:600;margin:0 0 12px}h3{font-size:18px;margin:0 0 8px}p{margin:0 0 16px}.muted,.eyebrow{color:var(--vg-text-secondary)}.eyebrow{font-size:13px;margin-bottom:12px}.intro{max-width:66ch;margin-bottom:28px}.box{background:white;border:1px solid var(--vg-border-subtle);border-radius:14px;padding:24px}.split{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(250px,1fr);gap:24px}.primary{border:1px solid var(--vg-action-primary);background:var(--vg-action-primary);color:white;padding:10px 18px;border-radius:8px;min-height:44px}.secondary{border:1px solid var(--vg-border-control);background:transparent;padding:9px 14px;border-radius:8px;min-height:44px}.quiet{border:0;background:none;padding:8px 0;min-height:44px;text-align:left;font-size:14px}.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.field{width:100%;border:1px solid var(--vg-border-control);border-radius:8px;padding:12px;background:white}.detail{padding:16px 0;border-top:1px solid var(--vg-border-subtle)}.detail small{display:block;color:var(--vg-text-secondary);margin-top:3px}.files{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0}.asset{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--vg-border-subtle);border-radius:8px;max-width:100%;font-size:13px}.asset img{width:48px;height:48px;object-fit:cover;border-radius:6px}.asset span{overflow-wrap:anywhere}.asset button{border:0;background:none;min-height:44px;min-width:44px;font-size:13px}.small{font-size:13px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.content-card{text-align:left;width:100%;background:white;border:1px solid var(--vg-border-subtle);border-radius:14px;padding:16px;min-width:0}.content-card:hover{border-color:var(--vg-border-control)}.empty-media{aspect-ratio:16/9;background:repeating-linear-gradient(135deg,#f2f2f4,#f2f2f4 5px,#e9e9ed 5px,#e9e9ed 6px);display:flex;align-items:center;justify-content:center;text-align:center;border-radius:10px;padding:24px;color:var(--vg-text-secondary);font-size:13px;margin-bottom:16px}.canvas-wrap{position:relative;aspect-ratio:9/10;max-height:510px;background:#EFEFF1;border:1px solid var(--vg-border-subtle);border-radius:10px;overflow:hidden;touch-action:none}.scene{height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:32px;text-align:center}.scene strong{font-size:30px;line-height:1.15;font-weight:600}.scene p{font-size:15px;margin:18px 0}.scene small{position:absolute;bottom:16px;left:16px;right:16px;font-size:12px;color:var(--vg-text-secondary)}canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}.context{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:13px;color:var(--vg-text-secondary);padding:10px 0}.composer{margin-top:24px;border:1px solid var(--vg-border-control);border-radius:14px;background:white;padding:16px}.composer textarea{resize:vertical;width:100%;min-height:64px;max-height:160px;border:0;outline:none;background:none}.composer:focus-within{outline:2px solid var(--vg-focus);outline-offset:2px}.composer .primary{margin-left:auto}.receipt{border-left:3px solid var(--vg-border-control);padding:12px 16px;margin-top:16px;background:white;overflow-wrap:anywhere}.receipt p:last-child{margin:0}.step{display:flex;gap:14px;padding:14px 0;border-top:1px solid var(--vg-border-subtle)}.step b{font-weight:500;color:var(--vg-text-secondary)}details{margin-top:24px;font-size:13px;color:var(--vg-text-secondary)}summary{cursor:pointer;min-height:44px;display:flex;align-items:center}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}[hidden]{display:none!important}.footer{font-size:12px;color:var(--vg-text-secondary);margin-top:32px}#toast{min-height:22px;margin:10px 0;font-size:13px;color:var(--vg-text-secondary)}@media(max-width:760px){.frame{grid-template-columns:1fr}nav{padding:12px 16px;border-right:0;border-bottom:1px solid var(--vg-border-subtle);display:flex;gap:4px;flex-wrap:wrap}.wordmark{width:100%;margin:0 0 6px}nav button{width:auto;padding:10px;font-size:14px;margin:0}.nav-note{display:none}main{padding:28px 16px}.split{grid-template-columns:1fr}.grid{grid-template-columns:1fr}h1{font-size:32px;line-height:38px}.box{padding:20px}.review{padding:8px 16px}.canvas-wrap{max-height:none;aspect-ratio:4/3}.scene strong{font-size:26px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

<body>
<div class="review"><b>A3 REVIEW · Not a live product</b><span>Uploads stay in this tab. No AI, microphone, account or publication calls.</span><button type="button" id="restart">First session</button><button type="button" id="review-work">Review example</button></div>
<div class="frame"><nav aria-label="Main navigation"><div class="wordmark">VIDEOGO</div><button data-page="today">Today</button><button data-page="studio">Studio</button><button data-page="knowledge">Knowledge</button><button data-page="connections">Connections</button><p class="nav-note">Work continues without a new prompt.<br>Scenario data is fictional.</p></nav><main id="main"></main></div>
<input type="file" id="upload" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm" multiple hidden>
<script>
'use strict';
const state={page:'start',files:[],target:null,region:null,message:'',receipt:null};
const main=document.getElementById('main');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function filesHTML(){return state.files.map((f,i)=>`<div class="asset">${f.type.startsWith('image/')?`<img src="${f.url}" alt="Local preview">`:''}<span>${esc(f.name)}<br><span class="muted">Local input only · not analyzed</span></span><button type="button" data-remove="${i}" aria-label="Remove ${esc(f.name)}">Remove</button></div>`).join('')}
function composer(){const ctx=state.target?'Service visit · v1 · '+(state.region?'marked frame at 00:03.2':'whole video'):'Business context · no video selected';return `<section class="composer" aria-label="Talk to Videogo"><div class="context"><span>${ctx}</span>${state.target?'<button class="quiet" type="button" id="clear-context">Clear context</button>':''}</div><label for="instruction" class="sr">Your question, idea or change</label><textarea id="instruction" placeholder="Tell Videogo something…">${esc(state.message)}</textarea><div class="files">${filesHTML()}</div><div class="bar"><button class="quiet" type="button" data-upload>Add media</button><button class="quiet" type="button" id="voice">Voice example</button><button class="primary" type="button" id="send">Send</button></div><p class="small muted" id="voice-note" hidden>Example transcript inserted. Your microphone was not activated.</p></section>${state.receipt?`<div class="receipt" role="status"><p><strong>Prototype receipt — not applied</strong></p><p>${esc(state.receipt)}</p><p class="small muted">No edit, memory update or publication has occurred.</p></div>`:''}`}
function render(){document.querySelectorAll('nav button').forEach(b=>{if(b.dataset.page===state.page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});let html='';
if(state.page==='start'){html=`<p class="eyebrow">FIRST SESSION</p><h1>A first video,<br>grounded in your business.</h1><p class="intro muted">Start with your website. Real photos or clips can help, but you do not need to gather anything first.</p><div class="box"><label for="website">Your website</label><input class="field" id="website" type="url" value="https://moretti.example" aria-describedby="fiction"><p id="fiction" class="small muted">Fictional address for this walkthrough. Nothing will be fetched.</p><button class="primary" id="continue" type="button">Continue</button></div>`}
else if(state.page==='understanding'){html=`<p class="eyebrow">BUSINESS UNDERSTANDING · FICTIONAL EXAMPLE</p><h1>Here’s what I understood.</h1><p class="intro muted">Moretti provides local heating and plumbing services. This example starts with a clear explanation of what happens during a service visit.</p><div class="box"><h2>Your first video</h2><p>Explain the visit using verified business facts and suitable media. No new filming required.</p><div class="detail"><h3>Have photos or clips already?</h3><p class="muted">Add your premises, products or existing footage. I’ll use only what is suitable and permitted.</p><button class="quiet" type="button" data-upload>Add media <span class="muted">— optional</span></button><div class="files">${filesHTML()}</div><p class="small muted">In production, access, reuse and people’s permissions are checked separately. An upload does not prove the claims in a video.</p></div><button class="primary" id="create" type="button">Create first video</button></div>`}
else if(state.page==='result'){html=`<p class="eyebrow">FIRST RESULT · LAYOUT SPECIMEN</p><h1>Your first video.<br>And what’s next.</h1><div class="split"><div class="box"><div class="empty-media">Actual QA-passed video appears here.<br>This specimen has not generated one.</div><h2>What happens during a service visit</h2><p class="muted">A business-specific explanation, with suitable authorized assets.</p><details><summary>Prepared publication package</summary><p>Final video, appropriate cover, caption and destination formatting. Publication still requires connection and authorization.</p></details></div><div class="box"><h2>If you continue</h2><div class="step"><b>01</b><div>Explain the visit.<br><span class="small muted">Use the business’s verified process.</span></div></div><div class="step"><b>02</b><div>Address repair versus replacement.<br><span class="small muted">Confirm the necessary business facts.</span></div></div><div class="step"><b>03</b><div>Choose the next useful communication.<br><span class="small muted">Use actual responses, not invented results.</span></div></div><p class="small muted">Proposed work, not completed or scheduled content.</p><button class="primary" id="enter" type="button">Explore the workspace</button></div></div>`}
else if(state.page==='today'){html=`<p class="eyebrow">CURRENT WORK</p><h1>Today</h1><p class="intro muted">Your service explainer is available to review in this scenario. Ordinary work does not need a new prompt from you.</p><div class="box"><h2>Service visit explainer</h2><p>Review the work, or tell me something about your business below.</p><button class="primary" id="open-work" type="button">Review video</button></div>${composer()}`}
else if(state.page==='studio'){html=`<h1>Studio</h1><p class="intro muted">All your work in one place. These cards are scenario fixtures, not produced media.</p><div class="grid">${['Service visit explainer','Repair or replacement','A useful next question'].map((t,i)=>`<button class="content-card" type="button" data-card="${i}"><div class="empty-media">${i===0?'Review fixture · no actual video':'Proposed · no media yet'}</div><h3>${t}</h3><span class="small muted">${i===0?'Open the contextual review':'Planned, not scheduled'}</span></button>`).join('')}</div>${composer()}`}
else if(state.page==='work'){html=`<button class="quiet" id="back" type="button">Back to Studio</button><h1>Service visit explainer</h1><p class="intro muted">Click, tap or circle the part you mean. Then describe what should change. The circle identifies a referent—not an editing operation.</p><div class="split"><div><div class="canvas-wrap"><div class="scene"><strong>What happens during<br>a service visit?</strong><p>Explain the process.<br>Use real assets where they help.</p><small>Illustrative frame · no generated video · 00:03.2</small></div><canvas id="referent" tabindex="0" role="button" aria-label="Select this illustrative frame. Enter selects the whole video."></canvas></div><div class="context"><span>Version 1 · sample moment 00:03.2</span><button type="button" class="quiet" id="whole">Use whole video</button></div></div><div><div class="box"><h2>Change the work, not a prompt.</h2><p>Describe the intended improvement. Add an existing photo or clip when it helps.</p><p class="small muted">Changes are local unless you request future scope. A question does not silently edit the video.</p></div>${composer()}</div></div>`}
else if(state.page==='knowledge'){html=`<h1>Knowledge</h1><p class="intro muted">Business facts and confirmed direction belong here—not an onboarding questionnaire.</p><div class="box"><h2>What carries forward</h2><p>Explicit corrections can have a clear, reversible scope. Inferred tone is not automatically your permanent identity.</p><div class="detail"><strong>Advanced taste and copy learning</strong><p class="small muted">Detailed mechanism intentionally reserved for a later design review. Basic explicit corrections remain supported.</p></div></div>${composer()}`}
else{html=`<h1>Connections</h1><p class="intro muted">Supported sources and publishing destinations. No connections are created by this prototype.</p><div class="box"><div class="detail">Instagram / TikTok<small class="muted">Account connection and final publication authorization are separate.</small></div><div class="detail">Selected media / authorized source files<small class="muted">Assets can be analyzed without being automatically approved for publication.</small></div><div class="detail">Owner contact<small class="muted">Use actual supported capabilities and consent. A chat connection is not blanket write authority.</small></div></div>${composer()}`}
main.innerHTML=html+'<div id="toast" role="status"></div><p class="footer">Review A3 · Checkpoint B visual tokens. Local file may use a system-font fallback; this is not typography acceptance. No production actions.</p>';wire()}
function page(p){state.page=p;state.target=p==='work'?'service-visit-v1':null;state.region=null;state.message='';state.receipt=null;render();window.scrollTo(0,0)}
function wire(){main.querySelectorAll('[data-upload]').forEach(b=>b.onclick=()=>document.getElementById('upload').click());main.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{const f=state.files.splice(Number(b.dataset.remove),1)[0];URL.revokeObjectURL(f.url);render()});const on=(id,fn)=>{const b=document.getElementById(id);if(b)b.onclick=fn};on('continue',()=>page('understanding'));on('create',()=>page('result'));on('enter',()=>page('today'));on('open-work',()=>page('work'));on('back',()=>page('studio'));on('whole',()=>{state.region=null;render()});on('clear-context',()=>{state.target=null;state.region=null;render()});main.querySelectorAll('[data-card]').forEach(b=>b.onclick=()=>{if(b.dataset.card==='0')page('work');else document.getElementById('toast').textContent='This is a proposed communication, not a produced video.'});const input=document.getElementById('instruction');if(input)input.oninput=()=>{state.message=input.value};on('voice',()=>{state.message=state.target?'Make this opening calmer. Keep the service facts and use the workshop photo if suitable. This video only.':'What are you planning next, and why?';input.value=state.message;document.getElementById('voice-note').hidden=false});on('send',()=>{if(!state.message.trim()){document.getElementById('toast').textContent='Describe a question, idea or change. Media alone is not an instruction.';return}const question=/\?$/.test(state.message.trim());state.receipt=(question?'Question for explanation. ':'Request requiring interpretation and normal permission checks. ')+(state.target?'Target: service visit v1, '+(state.region?'marked frame at 00:03.2':'whole video')+'. ':'Target: business context; no video selected. ')+state.files.length+' local attachment(s). Your words: “'+state.message+'”';render()});const c=document.getElementById('referent');if(c){let pts=[];const resize=()=>{c.width=c.clientWidth;c.height=c.clientHeight};resize();const xy=e=>{const r=c.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]};c.onpointerdown=e=>{c.setPointerCapture(e.pointerId);pts=[xy(e)]};c.onpointermove=e=>{if(!pts.length||!c.hasPointerCapture(e.pointerId))return;pts.push(xy(e));const g=c.getContext('2d');g.clearRect(0,0,c.width,c.height);g.strokeStyle='#0057D9';g.lineWidth=3;g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0]*c.width,p[1]*c.height):g.moveTo(p[0]*c.width,p[1]*c.height));g.stroke()};c.onpointerup=e=>{if(!pts.length)return;state.region={points:pts,version:1,time:3.2};state.target='service-visit-v1';pts=[];render()};c.onpointercancel=()=>{pts=[]};c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();state.target='service-visit-v1';state.region=null;render()}};if(state.region){const g=c.getContext('2d');g.strokeStyle='#0057D9';g.lineWidth=3;g.beginPath();state.region.points.forEach((p,i)=>i?g.lineTo(p[0]*c.width,p[1]*c.height):g.moveTo(p[0]*c.width,p[1]*c.height));if(state.region.points.length===1){const p=state.region.points[0];g.arc(p[0]*c.width,p[1]*c.height,12,0,Math.PI*2)}g.stroke()}}}
document.getElementById('upload').onchange=e=>{const invalid=[];for(const f of e.target.files){if(!/^(image\/(jpeg|png|webp)|video\/(mp4|webm))$/.test(f.type)||f.size>20*1024*1024){invalid.push(f.name);continue}state.files.push({name:f.name,type:f.type,url:URL.createObjectURL(f)})}e.target.value='';render();if(invalid.length)document.getElementById('toast').textContent='Demo intake accepts images or MP4/WebM up to 20 MB. Not added: '+invalid.join(', ')};
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>page(b.dataset.page));document.getElementById('restart').onclick=()=>page('start');document.getElementById('review-work').onclick=()=>page('work');window.addEventListener('beforeunload',()=>state.files.forEach(f=>URL.revokeObjectURL(f.url)));render();
</script></body></html>
