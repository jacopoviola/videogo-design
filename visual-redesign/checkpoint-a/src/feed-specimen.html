<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feed Preview specimens — Videogo</title>
<script src="js/boot.js"></script>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/components.css">
<style>
  body { padding: 32px; }
  .spec-panel { width: 360px; max-width: 100%; background: var(--vg-surface-content); border: 1px solid var(--vg-border-subtle); border-radius: var(--vg-radius-object); padding: var(--vg-space-8) var(--vg-space-5) var(--vg-space-6); display: flex; flex-direction: column; gap: var(--vg-space-3); }
  @media (max-width: 480px) { body { padding: 16px; } }
</style>
</head>
<body>
<!-- Component review specimens, not canonical product states. mode=populated (default) · partial · empty.
     Each mode is its own scenario; identified on the approval board, never inside the product UI. -->
<main>
<section class="spec-panel" aria-labelledby="feed-title">
  <h1 class="vg-visually-hidden" id="feed-title">Feed</h1>
  <div class="vg-segmented" role="group" aria-label="Context">
    <button type="button" aria-pressed="true">Feed</button>
    <button type="button" aria-pressed="false">Calendar</button>
  </div>
  <p class="vg-panel__note">@morettimpianti — how the grid looks with what's live and scheduled.</p>
  <div class="vg-feed-preview" id="feed"></div>
</section>
</main>
<script src="js/media-fixtures.js"></script>
<script src="js/media.js"></script>
<script>
  var mode = new URLSearchParams(location.search).get('mode') || 'populated';
  document.getElementById('feed').innerHTML = window.VGMedia.feedPreview(window.VG_FEED_SPECIMENS[mode] || [], window.VG_MEDIA);
</script>
</body>
</html>
