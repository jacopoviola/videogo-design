<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="DEMO FIXTURE — imported photo stand-in: work van parked on a residential street at dusk">
<title>DEMO FIXTURE — imported photo stand-in: work van parked on a residential street at dusk</title><desc>Representative design fixture for the Videogo visual redesign review. Illustration, not a photograph. Not customer media, not a real Videogo output, not evidence, not Videogo's brand style.</desc>
<defs>
