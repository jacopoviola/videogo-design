<!-- @dsCard group="Colors" viewport="700x150" name="Semantic hues" subtitle="Colour means you are needed — nothing else" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--vg-canvas)} .g{padding:16px;display:flex;gap:12px} .sw{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0} .sw i{display:block;height:56px;border:1px solid var(--vg-hairline-hi)} .sw b{font:var(--vg-label);letter-spacing:var(--vg-track-label);text-transform:uppercase;color:var(--vg-text-2);font-weight:600} .sw code{font:500 10px/1 var(--vg-mono);color:var(--vg-text-1)} .sw small{font:var(--vg-small);color:var(--vg-text-2)}</style></head>
<body><div class="g"><div class="sw"><i style="background:#FF0048"></i><b>signal</b><code>#FF0048</code><small>Blocked. NEED labels only. Never a border, fill, heading or decoration.</small></div><div class="sw"><i style="background:#E9A93C"></i><b>action</b><code>#E9A93C</code><small>Waiting on you. READY labels + primary controls.</small></div><div class="sw"><i style="background:#0C0B09"></i><b>on-hue</b><code>#0C0B09</code><small>Text on either hue. Never the reverse.</small></div></div></body></html>
