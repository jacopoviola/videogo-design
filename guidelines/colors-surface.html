<!-- @dsCard group="Colors" viewport="700x150" name="Surface ramp" subtitle="Warm near-black, hue ~65 — elevation is one step plus a border" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--vg-canvas)} .g{padding:16px;display:flex;gap:12px} .sw{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0} .sw i{display:block;height:56px;border:1px solid var(--vg-hairline-hi)} .sw b{font:var(--vg-label);letter-spacing:var(--vg-track-label);text-transform:uppercase;color:var(--vg-text-2);font-weight:600} .sw code{font:500 10px/1 var(--vg-mono);color:var(--vg-text-1)} .sw small{font:var(--vg-small);color:var(--vg-text-2)}</style></head>
<body><div class="g"><div class="sw"><i style="background:#0C0B09"></i><b>canvas</b><code>#0C0B09</code><small>Page</small></div><div class="sw"><i style="background:#12100E"></i><b>shell</b><code>#12100E</code><small>Nav, at rest</small></div><div class="sw"><i style="background:#171512"></i><b>panel</b><code>#171512</code><small>Needs you</small></div><div class="sw"><i style="background:#1C1A16"></i><b>nav-active</b><code>#1C1A16</code><small>Active nav only</small></div><div class="sw"><i style="background:#211E1A"></i><b>hairline</b><code>#211E1A</code><small>Rule</small></div><div class="sw"><i style="background:#292520"></i><b>hairline-hi</b><code>#292520</code><small>Card edge</small></div><div class="sw"><i style="background:#37322B"></i><b>border</b><code>#37322B</code><small>Controls, elevated edge</small></div></div></body></html>
