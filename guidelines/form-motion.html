<!-- @dsCard group="Spacing" viewport="700x130" name="Form & motion" subtitle="Radius 0 · no shadows · one curve · 6px max travel" -->
<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--vg-canvas)} .g{padding:16px;display:flex;gap:12px} .sw{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0} .sw i{display:block;height:56px;border:1px solid var(--vg-hairline-hi)} .sw b{font:var(--vg-label);letter-spacing:var(--vg-track-label);text-transform:uppercase;color:var(--vg-text-2);font-weight:600} .sw code{font:500 10px/1 var(--vg-mono);color:var(--vg-text-1)} .sw small{font:var(--vg-small);color:var(--vg-text-2)}</style></head>
<body><div style="padding:16px;display:flex;gap:12px"><div class="sw" style="background:var(--vg-panel);border:var(--vg-rule-border);padding:12px"><b>Needs you</b><small>panel + #37322B</small></div><div class="sw" style="background:var(--vg-shell);border:var(--vg-rule-hi);padding:12px"><b>At rest</b><small>shell + #292520</small></div><div class="sw" style="border:var(--vg-rule-absent);padding:12px"><b>Collecting</b><small>dashed hairline-hi</small></div><div class="sw" style="padding:12px"><b>Motion</b><small>120ms state · 200ms enter · 320ms page · cubic-bezier(.2,0,0,1). Never on a NEED, evidence values or silence.</small></div></div></body></html>
