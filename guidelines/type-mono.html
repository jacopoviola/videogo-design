<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;background:var(--vg-canvas)} .g{padding:16px;display:flex;gap:12px} .sw{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0} .sw i{display:block;height:56px;border:1px solid var(--vg-hairline-hi)} .sw b{font:var(--vg-label);letter-spacing:var(--vg-track-label);text-transform:uppercase;color:var(--vg-text-2);font-weight:600} .sw code{font:500 10px/1 var(--vg-mono);color:var(--vg-text-1)} .sw small{font:var(--vg-small);color:var(--vg-text-2)}</style></head>
<body><div style="padding:16px;display:flex;gap:40px;align-items:flex-end"><div style="display:flex;flex-direction:column;gap:10px"><span class="vg-label" style="color:var(--vg-text-2)">Saves · last 28 days</span><span style="font:var(--vg-metric);color:var(--vg-text-1)">41</span></div><div style="display:flex;flex-direction:column;gap:10px"><span class="vg-micro">Varese · Home services</span><span style="font:var(--vg-metric);color:var(--vg-text-1)">62%</span></div><div style="display:flex;flex-direction:column;gap:10px"><span style="font:var(--vg-key);letter-spacing:var(--vg-track-key);text-transform:uppercase;color:var(--vg-text-3)">Next policy</span><span style="font:var(--vg-metric);color:var(--vg-text-1)">€2,400</span></div><div style="display:flex;flex-direction:column;gap:10px"><span style="font:var(--vg-duration);color:var(--vg-text-1);background:var(--vg-duration-chip-bg);padding:4px 5px 3px;align-self:flex-start">1:08</span><span style="font:var(--vg-metric);color:var(--vg-text-1)">3.1×</span></div></div></body></html>
